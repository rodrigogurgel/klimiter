spring:
  application:
    name: klimiter
klimiter:
  policies:
    # Caminho do arquivo de políticas (ver docs/POLITICAS.md). Sobrescrevível por KLIMITER_POLICIES_PATH.
    path: config/policies/policies.yaml
    # Janela de silêncio do hot reload: eventos em rajada são coalescidos num único reload.
    reload-debounce: 200ms
  redis:
    # Contador global por janela (§4). Sobrescrevível por KLIMITER_REDIS_*.
    uri: redis://localhost:6379
    pool-size: 8
    key-prefix: klimiter
    # Client de cluster (Redis Cluster / ElastiCache cluster mode enabled): roteamento por slot e
    # descoberta de topologia. Scripts são single-key, então sem CROSSSLOT. false = standalone.
    cluster: false
  eviction:
    # Varredura do índice local de buckets (§4.2).
    interval: 60s
  shed:
    # Load shedding: rejeita (UNAVAILABLE) antes do hot path sob saturação. Cortes em
    # klimiter.shed.count{reason}. Valores CALIBRADOS a 2 cores por load test (ver docs/SATURACAO.md).
    concurrency:
      # Protetor EFETIVO: limitador adaptativo (Gradient2), teto de chamadas em voo guiado pelo RTT.
      # rtt-tolerance=1.3 mantém p99 < SLO 15ms no joelho (medido). KLIMITER_SHED_CONCURRENCY_*.
      enabled: true
      initial-limit: 40
      min-limit: 10
      max-concurrency: 200
      rtt-tolerance: 1.3
    cpu:
      # Portão por carga de CPU: OFF por padrão. No workload do klimiter os 2 cores NÃO saturam no
      # joelho (HIGH é contention-bound, LOW é round-trip-bound), então o portão quase não ajuda —
      # medido, corta muito e não segura a p99. Ligar só em perfis realmente CPU-bound. KLIMITER_SHED_CPU_*.
      enabled: false
      threshold: 0.90      # fração dos cores ALOCADOS (availableProcessors), não do host
      sample-interval: 250ms
  observability:
    # Fração das observações por-RPC do gRPC a registrar (1.0=todas; 0=off p/ recuperar throughput
    # sob CPU apertada — ver docs/SATURACAO.md §5.2). Não afeta os contadores klimiter.* nem o export.
    grpc-sample-rate: 1.0
