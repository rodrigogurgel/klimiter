spring:
  application:
    name: klimiter

klimiter:
  policies:
    # Caminho do arquivo de políticas (ver docs/POLITICAS.md). Sobrescrevível por KLIMITER_POLICIES_PATH.
    path: config/policies/policies.yaml
    # Janela de silêncio do hot reload: eventos em rajada são coalescidos num único reload.
    reload-debounce: 200ms
  redis:
    # Contador global por janela (§4). Sobrescrevível por KLIMITER_REDIS_*.
    uri: redis://localhost:6379
    pool-size: 8
    key-prefix: klimiter
    # Client de cluster (Redis Cluster / ElastiCache cluster mode enabled): roteamento por slot e
    # descoberta de topologia. Scripts são single-key, então sem CROSSSLOT. false = standalone.
    cluster: false
    # Timeout de cada comando ao Redis (default da Lettuce é 60s — veneno no hot path). Também é o
    # timeout do connect()/handshake TLS no boot, então precisa acomodar rediss:// e redes reais.
    # Estourar degrada o item para UNKNOWN (§7.5). Sobrescrevível por KLIMITER_REDIS_COMMAND_TIMEOUT.
    command-timeout: 250ms
  grpc:
    # Máximo de descriptors por RateLimitRequest — lote acima disso é rejeitado com INVALID_ARGUMENT
    # antes de tocar o core. Sobrescrevível por KLIMITER_GRPC_MAX_BATCH_SIZE.
    max-batch-size: 100
  eviction:
    # Varredura do índice local de buckets e da pressão fria (V2 §5.4).
    interval: 60s
  observability:
    # Fração das observações por-RPC do gRPC a registrar (1.0=todas; 0=off p/ recuperar throughput
    # sob CPU apertada — ver docs/SATURACAO.md §5.2). Não afeta os contadores klimiter.* nem o export.
    grpc-sample-rate: 1.0
