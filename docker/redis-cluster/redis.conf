# Config dos nós do Redis Cluster local (profile 'redis-cluster' do docker-compose).
# 3 masters, sem réplicas — suficiente para exercer roteamento por slot localmente.
#
# Sem cluster-announce-ip: dentro da rede do compose os nós e o klimiter-cluster se alcançam pelo
# IP interno do container (o MOVED devolve esse IP, que o klimiter — na mesma rede — resolve).
port 6379
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
# O contador da janela precisa sobreviver dentro da janela (§11).
appendonly yes
