# CI: roda a esteira de qualidade do projeto (./gradlew check = testes + JaCoCo com piso de
# cobertura + detekt) em cada PR e push às branches de integração. Os testes de integração do
# adapter Redis usam Testcontainers e rodam nativamente no runner ubuntu (Docker disponível);
# sem Docker eles seriam pulados (@Testcontainers(disabledWithoutDocker = true)).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Cache do Gradle + validação do wrapper.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, testes e verificações
        run: ./gradlew check --no-daemon

      # Relatórios de teste/cobertura/detekt para depurar falhas sem reproduzir localmente.
      - name: Publica relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/
          retention-days: 7
