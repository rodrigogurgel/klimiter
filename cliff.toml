# Configuração do git-cliff — https://git-cliff.org
# Gera o CHANGELOG.md a partir de commits Conventional Commits.
# Uso: git cliff -o CHANGELOG.md   (ou: git cliff --tag vX.Y.Z --unreleased --prepend CHANGELOG.md)

[changelog]
# Cabeçalho fixo do arquivo.
header = """
# Changelog

Todas as mudanças notáveis deste projeto são documentadas aqui.\n
O formato segue [Keep a Changelog](https://keepachangelog.com/pt-BR/1.1.0/)
e o versionamento segue [Semantic Versioning](https://semver.org/lang/pt-BR/).\n
Este arquivo é **gerado automaticamente** pelo [git-cliff](https://git-cliff.org)
a partir do histórico de commits — não edite à mão. Veja `cliff.toml` e o
[CONTRIBUTING.md](CONTRIBUTING.md#changelog).\n
"""

# Corpo: template Tera renderizado por release.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Não lançado]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} **[BREAKING]**{% endif %}\
    {% endfor %}
{% endfor %}\n
"""

trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"

# Mapeamento tipo -> seção do changelog.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Adicionado" },
  { message = "^fix", group = "<!-- 1 -->Corrigido" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refatorado" },
  { message = "^docs", group = "<!-- 4 -->Documentação" },
  { message = "^test", group = "<!-- 5 -->Testes" },
  { message = "^build|^ci", group = "<!-- 6 -->Build & CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^style", group = "<!-- 7 -->Manutenção" },
  { body = ".*security", group = "<!-- 8 -->Segurança" },
  { message = ".*", group = "<!-- 9 -->Outros" },
]
