# Exemplo — NÃO commite o Secret real. Copie, preencha a URI e aplique separadamente,
# ou crie via CLI:
#   kubectl -n klimiter create secret generic klimiter-redis \
#     --from-literal=uri='redis://<host>:6379'
# Para ElastiCache com TLS use o esquema rediss://.
apiVersion: v1
kind: Secret
metadata:
  name: klimiter-redis
  namespace: klimiter
  labels: { app.kubernetes.io/name: klimiter }
type: Opaque
stringData:
  uri: "redis://CHANGE-ME:6379"
