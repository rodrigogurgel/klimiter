apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: klimiter
  namespace: klimiter
  labels: { app.kubernetes.io/name: klimiter }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: klimiter
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: klimiter
  namespace: klimiter
  labels: { app.kubernetes.io/name: klimiter }
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: klimiter }
