# Catálogo de políticas de rate limit do klimiter.
#
# Formato e semântica: docs/POLITICAS.md (modelo do DESIGN-CONCEITUAL-V2.md §3.1, §8).
# Validado por policies.schema.json (o comentário abaixo liga o schema ao editor para
# autocomplete e erros inline).
#
# yaml-language-server: $schema=./policies.schema.json
version: 1

policies:
  # Dimensão por usuário: 1000 req/min.
  user_id:
    default:
      requests_per_unit: 1000
      unit: MINUTE
    overrides:
      # Conta de serviço com limite mais alto.
      # detailed_metric ligado: emite o contador por policy klimiter.policy.reserve.user_id.service-account.
      service-account:
        requests_per_unit: 50000
        unit: MINUTE
        detailed_metric: true
      # Usuário específico com limite próprio.
      user-42:
        requests_per_unit: 5000
        unit: MINUTE

  # Dimensão por IP: 100 req/s.
  ip:
    default:
      requests_per_unit: 100
      unit: SECOND

  # Dimensão por tenant: 1.000.000 req/dia.
  tenant:
    default:
      requests_per_unit: 1000000
      unit: DAY
