# Políticas de exemplo para os testes de carga (test/load).
#
# Os testes usam as dimensões rate_limit_account_id / rate_limit_source / rate_limit_flow.
# Sem elas no policies.yaml ativo, toda requisição é pass-through (§8) e os testes não
# exercitam o limite. Use de uma destas formas:
#
#   1) Copie estas dimensões para config/policies/policies.yaml — o hot reload aplica ao vivo (§8); ou
#   2) Suba o serviço apontando para este arquivo:
#        KLIMITER_POLICIES_PATH=test/load/policies.sample.yaml ./gradlew bootRun
#
# Formato/semântica: docs/POLITICAS.md. Tunagem por objetivo de teste: ver test/load/README.md.
version: 1

policies:
  # Alta cardinalidade: raramente contende → mede o caminho ao Redis sem negar muito.
  rate_limit_account_id:
    default:
      requests_per_unit: 60
      unit: SECOND
      prefetch:
        percent: 10

  # Cardinalidade média.
  rate_limit_source:
    default:
      requests_per_unit: 1000
      unit: SECOND
      prefetch:
        percent: 10

  # Dimensão "quente" (use chave fixa: FLOW_DISTINCT_KEYS=1 no ghz / DISTINCT_KEYS=1 no k6).
  # Cap mais baixo → a linha de pacing binda sob carga e a interação de prioridade (§6.5) aparece.
  rate_limit_flow:
    default:
      requests_per_unit: 6000
      unit: SECOND
      prefetch:
        percent: 10
